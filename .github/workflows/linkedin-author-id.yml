name: LinkedIn author ID (manual, one time)

on:
  workflow_dispatch:

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
    steps:
      - name: Print the author URN for LI_AUTHOR_URN
        run: |
          if [ -z "$LI_ACCESS_TOKEN" ]; then echo "Add the LI_ACCESS_TOKEN secret first." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          resp=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $LI_ACCESS_TOKEN" https://api.linkedin.com/v2/userinfo)
          code=$(echo "$resp" | tail -n1); body=$(echo "$resp" | sed '$d')
          if [ "$code" != "200" ]; then echo "LinkedIn answered $code: $body" | cut -c1-300 | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          sub=$(echo "$body" | python3 -c "import json,sys;print(json.load(sys.stdin)['sub'])")
          { echo "### Set the secret LI_AUTHOR_URN to:"; echo; echo "\`urn:li:person:$sub\`"; } | tee -a "$GITHUB_STEP_SUMMARY"
