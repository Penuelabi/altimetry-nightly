name: Flood trigger analysis (manual run)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ALTIMETRY_OUT_DIR: ${{ github.workspace }}/altdata
      BULLETIN_OUT_DIR: ${{ github.workspace }}/bulletin
      ANALYSIS_OUT_DIR: ${{ github.workspace }}/analysis_out
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      BULLETIN_FOLDER_ID: ${{ secrets.BULLETIN_FOLDER_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install -r requirements-bulletin.txt scikit-learn tabulate
      - name: Pull altimetry and county files from Drive
        run: |
          mkdir -p "$ALTIMETRY_OUT_DIR" "$BULLETIN_OUT_DIR" "$ANALYSIS_OUT_DIR"
          python drive_sync.py pull
          python drive_sync.py pull bulletin
      - name: Self-test
        run: python flood_trigger_analysis.py --selftest
      - name: Run analysis
        run: python flood_trigger_analysis.py
      - name: Commit a readable copy of the results to the repo
        continue-on-error: true
        run: |
          mkdir -p analysis_results
          python3 - <<'PY'
          import pandas as pd
          x = pd.read_excel('analysis_out/flood_trigger_analysis.xlsx', sheet_name=None)
          for k in ('Nested_CV', 'Models', 'Risk_ranking', 'Best_thresholds_insample', 'Notes'):
              if k in x:
                  x[k].to_csv(f'analysis_results/{k}.csv', index=False)
          PY
          cp -f analysis_out/flood_trigger_features.csv analysis_results/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_results
          git diff --cached --quiet || { git commit -m "Flood trigger analysis results [skip ci]"; git pull --rebase -q origin main || true; git push origin HEAD:main; }
      - name: Keep results
        uses: actions/upload-artifact@v4
        with:
          name: flood-trigger-analysis
          path: analysis_out/
