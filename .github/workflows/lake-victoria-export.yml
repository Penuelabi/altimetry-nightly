name: Export Lake Victoria level series (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      BULLETIN_FOLDER_ID: ${{ secrets.BULLETIN_FOLDER_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      ALTIMETRY_OUT_DIR: ${{ github.workspace }}/altdata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt
      - run: pip install -r requirements-bulletin.txt
      - name: Pull altimetry files from Drive
        run: python drive_sync.py pull
      - name: Export the Lake Victoria series
        run: python export_lake_victoria.py 2>&1 | tee "$RUNNER_TEMP/lv.log"
      - name: Commit the series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lake_victoria_levels.csv
          git diff --cached --quiet || { git commit -m "Update Lake Victoria level series [skip ci]"; git pull --rebase -q origin main || true; git push origin HEAD:main; }
