name: Hydroweb Lake Victoria probe (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HYDROWEB_API_KEY: ${{ secrets.HYDROWEB_API_KEY }}
      OUT: ${{ github.workspace }}/hydroweb_victoria_out
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -q py-hydroweb
      - name: Ask Hydroweb for Lake Victoria
        run: python hydroweb_victoria_probe.py 2>&1 | tee "$RUNNER_TEMP/probe.log"
      - name: Summary
        if: always()
        run: |
          { echo '```'; tail -n 60 "$RUNNER_TEMP/probe.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the log and any Victoria file
        if: always()
        run: |
          mkdir -p data/hydroweb_victoria
          cp "$RUNNER_TEMP/probe.log" data/hydroweb_victoria/probe.log
          [ -d hydroweb_victoria_out/victoria_found ] && cp -r hydroweb_victoria_out/victoria_found/. data/hydroweb_victoria/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hydroweb_victoria
          git diff --cached --quiet || { git commit -m "Hydroweb Lake Victoria probe result [skip ci]"; git pull --rebase -q origin main || true; git push origin HEAD:main; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydroweb-victoria-probe
          path: hydroweb_victoria_out
          if-no-files-found: ignore
