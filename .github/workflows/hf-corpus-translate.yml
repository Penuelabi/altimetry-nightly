name: HF corpus fetch + translation (manual / on push to hf-translate)

on:
  workflow_dispatch:
  push:
    branches: [hf-translate]
    paths:
      - 'hf_tools/**'
      - '!hf_tools/draft_template_translations.py'
      - '!hf_tools/eval_models.py'
      - '!hf_tools/eval_google.py'
      - '!hf_tools/translate_google.py'
      - '!hf_tools/draft_templates_google.py'
      - '.github/workflows/hf-corpus-translate.yml'

permissions:
  contents: write

concurrency:
  group: hf-branch-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install requests huggingface_hub
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece
      - name: Fetch first 100 corpus rows
        env:
          HUGGINGFACE: ${{ secrets.HUGGINGFACE }}
        run: python hf_tools/fetch_hf_rows.py --out hf_tools/hf_output
      - name: Translate (HF API, local fallback)
        env:
          HUGGINGFACE: ${{ secrets.HUGGINGFACE }}
        continue-on-error: true
        run: |
          set -o pipefail
          python hf_tools/translate_hf.py --out hf_tools/translations.md 2>&1 | tee hf_tools/translate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-output
          path: |
            hf_tools/hf_output.*
            hf_tools/translations.md
            hf_tools/translate.log
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hf_tools
          git commit -m "HF corpus sample and translations [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
