name: Nightly altimetry update (00:00 Cairo)

on:
  schedule:
    - cron: '0 21 * * *'    # 00:00 Cairo in summer (UTC+3)
    - cron: '0 22 * * *'    # 00:00 Cairo in winter (UTC+2)
  workflow_dispatch:         # "Run workflow" button for a manual run

concurrency:
  group: altimetry-nightly   # never two runs writing the same files at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALTIMETRY_OUT_DIR: ${{ github.workspace }}/data
      ALTIMETRY_WORK_DIR: ${{ runner.temp }}/hydroweb_extract
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      DAHITI_API_KEY: ${{ secrets.DAHITI_API_KEY }}
      HYDROWEB_API_KEY: ${{ secrets.HYDROWEB_API_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Is it 00:00 in Cairo?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 cairo_midnight_check.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packages
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: "Step 0: pull working files from Drive"
        if: steps.gate.outputs.run == 'true'
        run: python drive_sync.py pull

      - name: "Steps 1-4: check merged, download new, GEE climate, upload to GEE"
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          {
            echo ""
            echo "======================================================================"
            echo "GITHUB RUN $(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M %Z')  (run #${{ github.run_number }})"
            echo "======================================================================"
          } >> "$ALTIMETRY_OUT_DIR/nightly_run_log.txt"
          python merge_dahiti_hydroweb.py 2>&1 | tee -a "$ALTIMETRY_OUT_DIR/nightly_run_log.txt"

      - name: "Save: push updated files back to Drive"
        if: always() && steps.gate.outputs.run == 'true'
        run: python drive_sync.py push
