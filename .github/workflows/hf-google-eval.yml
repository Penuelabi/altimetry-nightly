name: Evaluate Google Cloud Translation on the corpus sample (manual / on push to hf-translate)

on:
  workflow_dispatch:
  push:
    branches: [hf-translate]
    paths:
      - 'hf_tools/eval_google.py'
      - '.github/workflows/hf-google-eval.yml'

permissions:
  contents: write

jobs:
  google:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-auth sacrebleu
      - name: Evaluate
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -o pipefail
          mkdir -p eval_results
          python hf_tools/eval_google.py --n 30 2>&1 | tee eval_results/google-translate-v2.log
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval_results/ || true
          git commit -m "Model evaluation: google-translate-v2 [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((RANDOM % 10 + 3))
          done
