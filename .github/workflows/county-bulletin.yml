name: County hydro-climate bulletin (twice daily, after ECMWF 00 and 12 UTC releases)

on:
  schedule:
    - cron: '30 9 * * *'     # 09:30 UTC = 11:30 Juba; ECMWF open-data 00 UTC run is out by ~08:00 UTC
    - cron: '30 21 * * *'    # 21:30 UTC = 23:30 Juba; ECMWF open-data 12 UTC run is out by ~20:00 UTC
  workflow_dispatch:

concurrency:
  group: county-bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BULLETIN_OUT_DIR: ${{ github.workspace }}/bulletin
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      BULLETIN_FOLDER_ID: ${{ secrets.BULLETIN_FOLDER_ID }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set temp folder and ECMWF cycle
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "BULLETIN_TMP_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          # evening schedule (and manual runs after 21:00 UTC) use the 12 UTC ECMWF run, otherwise the 00 UTC run
          if [ "$SCHEDULE" = "30 21 * * *" ] || { [ -z "$SCHEDULE" ] && [ "$(date -u +%H)" -ge 21 ]; }; then
            echo "ENS_RUN_HOUR=12" >> "$GITHUB_ENV"
          else
            echo "ENS_RUN_HOUR=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt

      - name: Install packages
        run: pip install -r requirements-bulletin.txt

      - name: Pull bulletin files from Drive
        run: python drive_sync.py pull bulletin

      - name: Verify past forecasts against observed rain (optional)
        continue-on-error: true
        run: python verify_forecasts.py

      - name: Run county bulletin (antecedent conditions + ENS outlook + GEE asset)
        run: |
          set -o pipefail
          python county_bulletin.py 2>&1 | tee "$RUNNER_TEMP/bulletin.log"

      - name: Email digest (optional, needs SMTP secrets)
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_MIN_LEVEL: ${{ vars.DIGEST_MIN_LEVEL }}
          DIGEST_ONLY_IF_ALERTS: ${{ vars.DIGEST_ONLY_IF_ALERTS }}
        run: python send_digest.py 2>&1 | tee "$RUNNER_TEMP/digest.log"

      - name: Show warnings and digest result in run summary
        if: always()
        run: |
          { echo '### Warnings in bulletin log'; echo '```'; grep -a 'WARNING' "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-300 | head -40; echo '```';
            echo '### Email digest'; echo '```'; cat "$RUNNER_TEMP/digest.log" 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Show error tail in run summary
        if: failure()
        run: |
          { echo '### Last lines of bulletin log'; echo '```'; tail -n 40 "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push updated bulletin files back to Drive
        if: always()
        run: python drive_sync.py push bulletin
