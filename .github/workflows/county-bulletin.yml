name: County hydro-climate bulletin (daily, after ECMWF 00 UTC release)

on:
  schedule:
    - cron: '30 9 * * *'     # 09:30 UTC = 12:30 Juba; ECMWF open-data 00 UTC run is out by ~08:00 UTC
  workflow_dispatch:

concurrency:
  group: county-bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BULLETIN_OUT_DIR: ${{ github.workspace }}/bulletin
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      BULLETIN_FOLDER_ID: ${{ secrets.BULLETIN_FOLDER_ID }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set temp folder
        run: echo "BULLETIN_TMP_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt

      - name: Install packages
        run: pip install -r requirements-bulletin.txt

      - name: Pull bulletin files from Drive
        run: python drive_sync.py pull bulletin

      - name: Run county bulletin (antecedent conditions + ENS outlook + GEE asset)
        run: |
          set -o pipefail
          python county_bulletin.py 2>&1 | tee "$RUNNER_TEMP/bulletin.log"

      - name: Show error tail in run summary
        if: failure()
        run: |
          { echo '### Last lines of bulletin log'; echo '```'; tail -n 40 "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push updated bulletin files back to Drive
        if: always()
        run: python drive_sync.py push bulletin
