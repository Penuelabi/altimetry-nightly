name: County hydro-climate bulletin (twice daily, after ECMWF 00 and 12 UTC releases)

on:
  schedule:
    - cron: '30 9 * * *'     # 09:30 UTC = 11:30 Juba; ECMWF open-data 00 UTC run is out by ~08:00 UTC
    - cron: '30 21 * * 1-6'  # Mon-Sat 21:30 UTC = 23:30 Juba; ECMWF open-data 12 UTC run is out by ~20:00 UTC
    - cron: '30 21 * * 0'    # Sunday 21:30 UTC, after the weekly flood-extent (04:00) and exposure (18:00) jobs; the only scheduled run that emails
  workflow_dispatch:
    inputs:
      email:
        description: 'Email the digest to subscribers (untick to rebuild and post to Facebook only)'
        type: boolean
        default: true
      force_social:
        description: 'Post to Facebook even if no county is at the alert level (test the social pipeline)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: county-bulletin
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BULLETIN_OUT_DIR: ${{ github.workspace }}/bulletin
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      BULLETIN_FOLDER_ID: ${{ secrets.BULLETIN_FOLDER_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      ALTIMETRY_OUT_DIR: ${{ github.workspace }}/altdata
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set temp folder and ECMWF cycle
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "BULLETIN_TMP_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          # evening schedule (and manual runs after 21:00 UTC) use the 12 UTC ECMWF run, otherwise the 00 UTC run
          if [ "$SCHEDULE" = "30 21 * * 1-6" ] || [ "$SCHEDULE" = "30 21 * * 0" ] || { [ -z "$SCHEDULE" ] && [ "$(date -u +%H)" -ge 21 ]; }; then
            echo "ENS_RUN_HOUR=12" >> "$GITHUB_ENV"
          else
            echo "ENS_RUN_HOUR=0" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt

      - name: Install packages
        run: pip install -r requirements-bulletin.txt

      - name: Pull bulletin files from Drive
        run: |
          python drive_sync.py pull bulletin
          python drive_sync.py pull || echo "WARNING: altimetry pull failed; river trigger will be skipped"
          python export_lake_victoria.py || echo "WARNING: Lake Victoria series not refreshed"

      - name: Verify past forecasts against observed rain (optional)
        continue-on-error: true
        run: python verify_forecasts.py

      - name: Run county bulletin (antecedent conditions + ENS outlook + GEE asset)
        run: |
          set -o pipefail
          python county_bulletin.py 2>&1 | tee "$RUNNER_TEMP/bulletin.log"

      - name: Link each county to its nearest / upstream river gauge
        continue-on-error: true
        run: |
          python county_station_link.py 2>&1 | tee "$RUNNER_TEMP/link.log"
          cp -f "$BULLETIN_OUT_DIR/county_station_link.csv" county_station_link.csv 2>/dev/null || true
          { echo '### County -> gauge link'; echo '```';
            tail -n 40 "$RUNNER_TEMP/link.log" 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build combined county report PDF
        continue-on-error: true
        run: |
          sudo apt-get install -y -q fonts-dejavu-core || true
          python build_report.py 2>&1 | tee "$RUNNER_TEMP/report.log"

      - name: Email digest (optional, needs SMTP secrets; weekly on Sunday night, plus manual runs)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.email != 'false') || github.event.schedule == '30 21 * * 0'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_KIND: weekly
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_MIN_LEVEL: ${{ vars.DIGEST_MIN_LEVEL }}
          DIGEST_ONLY_IF_ALERTS: ${{ vars.DIGEST_ONLY_IF_ALERTS }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          SUBSCRIBERS_CSV_URL: ${{ vars.SUBSCRIBERS_CSV_URL }}
          UNSUBSCRIBE_URL: ${{ vars.UNSUBSCRIBE_URL }}
          UNSUBSCRIBE_CSV_URL: ${{ vars.UNSUBSCRIBE_CSV_URL }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
          ALTIMETRY_OUT_DIR: ${{ github.workspace }}/altdata
        run: python send_digest.py 2>&1 | tee "$RUNNER_TEMP/digest.log"

      - name: Post to Facebook / LinkedIn (optional, needs secrets)
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          LI_AUTHOR_URN: ${{ secrets.LI_AUTHOR_URN }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          SOCIAL_MIN_LEVEL: ${{ vars.SOCIAL_MIN_LEVEL }}
          SOCIAL_RUN_HOURS: "00,12"
          SOCIAL_DRY_RUN: "0"
          SOCIAL_ONLY_IF_ALERTS: ${{ github.event.inputs.force_social == 'true' && '0' || vars.SOCIAL_ONLY_IF_ALERTS }}
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
        run: python send_social.py 2>&1 | tee "$RUNNER_TEMP/social.log"

      - name: Show warnings and digest result in run summary
        if: always()
        run: |
          { echo '### Warnings in bulletin log'; echo '```'; grep -a 'WARNING' "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-300 | head -40; echo '```';
            echo '### River trigger'; echo '```'; grep -a 'RIVER TRIGGER\|River trigger' "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-400; echo '```';
            echo '### Email digest'; echo '```'; cat "$RUNNER_TEMP/digest.log" 2>/dev/null | cut -c1-300; echo '```';
            echo '### Social posts'; echo '```'; cat "$RUNNER_TEMP/social.log" 2>/dev/null | cut -c1-600 | tail -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Show error tail in run summary
        if: failure()
        run: |
          { echo '### Last lines of bulletin log'; echo '```'; tail -n 40 "$RUNNER_TEMP/bulletin.log" 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest report for the GEE download link (midnight Juba run and manual runs)
        if: always() && (github.event.schedule != '30 9 * * *')
        continue-on-error: true
        run: |
          if [ -f reports/latest.pdf ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/latest.pdf
            [ -f county_station_link.csv ] && git add county_station_link.csv
            git diff --cached --quiet || { git commit -m "Update latest county report PDF + county-gauge link [skip ci]"; git pull --rebase -q origin main || true; git push origin HEAD:main; }
          fi

      - name: Push updated bulletin files back to Drive
        if: always()
        run: python drive_sync.py push bulletin
