name: HydroWeb bbox probe (read-only)
on:
  workflow_dispatch:
  push:
    branches: [reliefweb-news-pull]
    paths: [hydroweb_bbox_probe.py, .github/workflows/hydroweb-bbox-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HYDROWEB_API_KEY: ${{ secrets.HYDROWEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas
      - run: python hydroweb_bbox_probe.py
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add hydroweb_lake_check/bbox_stations.csv hydroweb_lake_check/bbox_stations.md
          git diff --cached --quiet && exit 0
          git commit -m "HydroWeb bbox probe"
          for i in 1 2 3 4; do git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" && exit 0; sleep $((i*8)); done; exit 1
