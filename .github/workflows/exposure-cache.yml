name: Exposure cache for the county report (weekly, incremental)

on:
  schedule:
    - cron: '0 18 * * 0'      # Sundays 18:00 UTC; the county report reads data/exposure_cache.json
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Recompute everything (1) or only what is missing (blank)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: exposure-cache
  cancel-in-progress: false

jobs:
  exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      ALTIMETRY_OUT_DIR: ${{ github.workspace }}/altdata
      EXPOSURE_REFRESH: ${{ github.event.inputs.refresh }}
      EXPOSURE_BUDGET_MIN: '320'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt
      - run: pip install -r requirements-bulletin.txt
      - name: Pull station list from Drive
        run: python drive_sync.py pull
      - name: Compute exposure (payams, then stations)
        run: python exposure_cache.py 2>&1 | tee "$RUNNER_TEMP/exposure.log"
      - name: Commit the cache
        if: always()
        run: |
          tail -n 30 "$RUNNER_TEMP/exposure.log" >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f data/exposure_cache.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/exposure_cache.json
            git diff --cached --quiet || { git commit -m "Update exposure cache [skip ci]"; git pull --rebase -q origin main || true; git push origin HEAD:main; }
          fi
