name: Exposure cache for the county report (weekly, incremental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-bulletin.txt
      - run: pip install -r requirements-bulletin.txt
      - run: PYTHONPATH=. python scripts/asset_diag.py
