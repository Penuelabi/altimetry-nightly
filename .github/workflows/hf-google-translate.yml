name: Google Translate drafts - news item and alert templates (manual / on push to hf-translate)

# Machine drafts for native-speaker review. Reads aa_config/message_templates.csv; never edits it.
# Nothing is validated or sent.

on:
  workflow_dispatch:
  push:
    branches: [hf-translate]
    paths:
      - 'hf_tools/translate_google.py'
      - 'hf_tools/draft_templates_google.py'
      - '.github/workflows/hf-google-translate.yml'

permissions:
  contents: write

jobs:
  google:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-auth sacrebleu
      - name: Translate
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          set -o pipefail
          mkdir -p aa_out
          python hf_tools/translate_google.py 2>&1 | tee hf_tools/translate_google.log
          python hf_tools/draft_templates_google.py 2>&1 | tee aa_out/template_translation_drafts_google.log
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf_tools/translations_google.md hf_tools/translate_google.log aa_out/template_translation_drafts_google.csv aa_out/template_translation_drafts_google.log || true
          git commit -m "Google Translate drafts (unvalidated) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((RANDOM % 10 + 3))
          done
