# SMSGate private server configuration. deploy_gcp.sh vm fills the <> values and copies this file to the VM as
# /opt/smsgate/config.yml (mounted at /app/config.yml). Never commit the filled file.
# Check the current key names against config.example.yml in github.com/capcom6/sms-gateway before deploying.
gateway:
  mode: private
  private_token: <PRIVATE_TOKEN>        # the same token you type into the Android app
http:
  listen: 0.0.0.0:3000
database:
  host: mariadb
  port: 3306
  user: smsgate
  password: <DB_PASSWORD>
  database: smsgate
  timezone: UTC
